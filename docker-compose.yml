services:
  web:
    build: .
    # SQLite locks on concurrent writes, so gunicorn runs 1 worker with threads
    # (command is set in the Dockerfile).
    volumes:
      # Named volumes, not bind mounts: Portainer clones the repo inside its own
      # container, so ./db.sqlite3 does not exist on the host and Docker would
      # create a directory there. The image ships db.sqlite3 as a seed that the
      # entrypoint copies into the data volume on first start.
      - ntkm_data:/app/data
      - ntkm_media:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SECRET_KEY=t49MYWOvZbYTeuuqctyLOnFRUTpF-7FNWnGM-K-r5O01rwslxS27FA2fMZivspOsKo8
      - DEBUG=False
      # Hostnames Django accepts. Requests for any other Host header return 400.
      - ALLOWED_HOSTS=ntkm-backend.aran8276.my.id,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://ntkm-backend.aran8276.my.id
      - PUBLIC_BASE_URL=https://ntkm-backend.aran8276.my.id
      - FRONTEND_ORIGIN=https://ntkm-website.vercel.app
      - FRONTEND_URL=https://ntkm-website.vercel.app
      - SERVE_MEDIA=True
      # Prototype only: /api/v1/auth/dev-login logs in as ANY email (admins too)
      # without a password. Set both to False before real users or data arrive.
      - AUTH_DEV_LOGIN=True
      - AUTH_DEV_LOGIN_ALLOW_PRODUCTION=True
    ports:
      - "20002:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/django-admin/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ntkm_data:
  ntkm_media:
